stages:
  - formatting
  - test


black-checker:
  image: pyfound/black:latest_release
  stage: formatting
  tags:
      - docker
      - ubuntu
  script:
    - black --check ./src
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'


unit-test-job:
  image: git.rst.e-technik.tu-dortmund.de:5005/common/docker-group/ubuntu-ml:ubuntu18.04-cuda11.1.1-cudnn8
  tags:
      - docker
      - ubuntu
  stage: test
  script:
    - python3.8 -m pip install -U pip setuptools wheel
    - python3.8 -m pip install ".[test]"

    - python3.8 -m pip install -q pytest
    - pytest --cov=src test/
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'